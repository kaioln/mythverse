# Blueprint do Render para TESTES 100% grátis: Web Service Free + banco PostgreSQL grátis no Neon.
# New → Blueprint → escolha o repositório e a branch. O Render pede o valor de DATABASE_URL
# (cole a connection string do Neon). O plano Free não tem disco, por isso os dados ficam no Neon.
# Versão paga com SQLite em disco persistente: render.starter.yaml.
services:
  - type: web
    name: mythverse
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SECURE_COOKIE
        value: "1"
      - key: DATABASE_URL
        sync: false
