<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1a">
  <meta name="description" content="Mythverse: RPG de heróis de todos os mundos. Convoque, forme laços, fortaleça sua equipe e feche a Fenda.">
  <title>Mythverse: Heróis de todos os mundos</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon-64.png?v=2">
  <link rel="apple-touch-icon" href="assets/brand/favicon-192.png?v=2">
  <meta property="og:title" content="Mythverse: Heróis de todos os mundos">
  <meta property="og:image" content="assets/brand/logo-full.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700;800&family=Shippori+Mincho:wght@700&family=Shippori+Mincho+B1:wght@700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261002i">
  <link rel="stylesheet" href="theme-sumi.css?v=20261002i">
  <link rel="stylesheet" href="theme-game.css?v=20261002i">
</head>
<body class="booting">
  <div class="boot" id="boot">
    <div class="boot-inner">
      <picture><source type="image/webp" srcset="assets/brand/mv-full-440.webp 440w, assets/brand/mv-full-720.webp 720w" sizes="(max-width:600px) 86vw, 440px"><img class="boot-logo" src="assets/brand/mv-full-440.png" srcset="assets/brand/mv-full-440.png 440w, assets/brand/mv-full-720.png 720w" sizes="(max-width:600px) 86vw, 440px" width="440" height="240" alt="Mythverse: Heróis de todos os mundos"></picture>
      <div class="boot-bar"><span id="boot-fill"></span></div>
      <small id="boot-label">Preparando a jornada…</small>
    </div>
  </div>

  <div class="auth" id="auth" hidden></div>
  <div class="ask-modal" id="ask-modal" hidden></div>

  <div class="app" id="app">
    <header class="hud-top">
      <div class="brand"><picture><source type="image/webp" srcset="assets/brand/mv-horizontal-280.webp 1x, assets/brand/mv-horizontal-520.webp 2x"><img src="assets/brand/mv-horizontal-280.png" srcset="assets/brand/mv-horizontal-280.png 1x, assets/brand/mv-horizontal-520.png 2x" width="140" height="48" alt="Mythverse"></picture></div>

      <button class="player-chip" id="player-chip" type="button" title="Perfil e configurações">
        <span class="player-avatar"><img id="player-avatar-img" alt="" hidden><span class="avatar-fallback hanko" aria-hidden="true">神</span><i class="cloud-dot" id="cloud-dot" data-tip="Salvamento"></i></span>
        <span class="player-copy">
          <strong id="player-name">Viajante</strong>
          <small><span id="player-level">Conta Nv. 1</span> · <span id="power-label">Poder,</span></small>
          <span class="xp-mini"><span id="player-xp-fill"></span></span>
        </span>
      </button>

      <div class="resources" id="resources">
        <div class="res gold" data-tip="Ouro, ganho em combate. Usado em prédios, treino, aprimoramentos e loja."><i></i><b id="gold-value">, </b></div>
        <div class="res crystal" data-tip="Cristais, marcos de progresso, missões e conquistas. Troque por chaves na Loja."><i></i><b id="crystal-value">, </b></div>
        <div class="res dust" data-tip="Éter, desmontando itens. Usado para encantar afixos na Oficina."><i></i><b id="dust-value">, </b></div>
        <div class="res ore" data-tip="Tamahagane, aço sagrado para aprimorar itens na Forja."><i></i><b id="ore-value">, </b></div>
        <button class="res key" data-open="collection" type="button" data-tip="Convocações disponíveis (grátis ou chaves)."><i></i><b id="key-value">0</b><small id="key-caption">Grátis</small></button>
        <button class="res gem" data-open="shop:gems" type="button" data-tip="Gemas, moeda de dinheiro real (100 = R$ 1,00), usada no Mercado de Jogadores. Clique para abrir a carteira."><i></i><b id="gem-value">0</b></button>
      </div>

      <div class="top-actions">
        <button class="save-status off" id="save-status" type="button" data-tip="Salvamento" aria-label="Salvar progresso agora"><i></i><b>Local</b></button>
        <button class="icon-btn" id="panel-toggle" type="button" data-tip="Mostrar/ocultar painel lateral" aria-label="Painel lateral"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM15 5v14"/></svg></button>
        <button class="icon-btn" id="sound-btn" type="button" data-tip="Som" aria-label="Som"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="sound-off" d="M16 9l5 6M21 9l-5 6"/></svg></button>
        <button class="icon-btn" id="help-btn" type="button" data-tip="Como jogar" aria-label="Ajuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5V14M12 17.5v.01"/></svg></button>
      </div>
    </header>

    <nav class="side-nav" aria-label="Navegação">
      <button class="nav" data-panel="journey" type="button"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><b>Mapa</b></button>
      <button class="nav" data-panel="adventure" type="button"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v6c0 4 3.4 7.3 8 8 4.6-.7 8-4 8-8V7z"/><path d="M9 12l2 2 4-4"/></svg><b>Aventuras</b><em id="adventure-badge" hidden>!</em></button>
      <button class="nav" data-panel="party" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A4.5 4.5 0 0 1 21 18.5"/></svg><b>Equipe</b><em id="party-badge" hidden>!</em></button>
      <button class="nav" data-panel="collection" type="button"><svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><b>Heróis</b><em id="summon-badge" hidden>!</em></button>
      <button class="nav" data-panel="inventory" type="button"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><b>Bolsa</b><em id="inventory-badge" hidden>0</em></button>
      <button class="nav" data-panel="ranking" type="button" id="nav-ranking"><svg viewBox="0 0 24 24"><path d="M8 21V11H3v10zM15 21V4h-5v17zM21 21v-7h-5v7z"/></svg><b>Ranking</b></button>
      <button class="nav" data-panel="arena" type="button"><svg viewBox="0 0 24 24"><path d="M4 20 14 10M14 10l3-7 3 3-7 3M20 20 10 10M10 10 7 3 4 6l7 3"/></svg><b>Arena</b></button>
      <button class="nav" data-panel="chat" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg><b>Chat</b></button>
      <button class="nav" data-panel="guild" type="button"><svg viewBox="0 0 24 24"><path d="M5 21V4l7 3 7-3v17"/><path d="M5 11l7 3 7-3"/></svg><b>Guilda</b></button>
      <button class="nav" data-panel="talents" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><circle cx="12" cy="13" r="2"/><path d="M12 7v4M10.5 14.5 6.5 17M13.5 14.5l4 2.5"/></svg><b>Talentos</b><em id="talent-badge" hidden>0</em></button>
      <button class="nav" data-panel="city" type="button"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg><b>Cidade</b></button>
      <button class="nav" data-panel="shop" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 5h-13z"/><path d="M5.5 12 7 20h10l1.5-8M9 7V5h6v2"/></svg><b>Loja</b></button>
      <button class="nav" data-panel="quests" type="button"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg><b>Missões</b><em id="quest-badge" hidden>0</em></button>
      <button class="nav" data-panel="wiki" type="button"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg><b>Wiki</b></button>
    </nav>

    <main class="stage-col">
      <section class="stage" id="viewport">
        <canvas id="game-canvas" width="1280" height="720" aria-label="Campo de batalha"></canvas>

        <div class="stage-top">
          <div class="zone-chip">
            <span class="zone-kicker" id="zone-kicker">FESTIVAL DAS CEREJEIRAS · TSUKIMORI</span>
            <h1 id="zone-title">Grande Cidade de Tsukimori</h1>
            <div class="zone-meta"><span id="zone-difficulty">Festival ativo</span><span id="wave-label">8 distritos em celebração</span><span id="power-check" hidden></span></div>
          </div>
          <div class="boss-panel" id="boss-panel" hidden>
            <div class="boss-line"><span id="boss-kind">CHEFE</span><strong id="boss-name">, </strong><b id="boss-percent">100%</b></div>
            <div class="boss-track"><span class="boss-chip" id="boss-chip"></span><span class="boss-fill" id="boss-fill"></span><span class="boss-shield" id="boss-shield"></span><i id="boss-mark-1"></i><i id="boss-mark-2"></i></div>
            <div class="boss-break" id="boss-break" data-tip="Postura: golpes, habilidades e ultimates enchem a barra. Cheia, o chefe fica atordoado 4s, perde o ataque preparado e recebe +35% de dano."><span id="boss-break-fill"></span><em id="boss-break-label">POSTURA</em></div>
            <div class="boss-sub"><small id="boss-phase">Fase 1</small><small id="boss-timer"></small></div>
          </div>
          <div class="stage-controls">
            <button class="ctl" id="city-focus-btn" type="button" aria-pressed="false" data-tip="Ampliar a cidade e recolher os cartões da equipe."><span>⛶</span><b>AMPLIAR</b></button>
            <button class="ctl journey-cta" id="journey-cta" data-open="journey" type="button" hidden data-tip="Abrir mapa do mundo (M)." aria-label="Mapa do mundo"><span><svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg></span><b>MAPA</b></button>
            <button id="mode-btn" class="ctl mode" type="button" data-mode="auto" data-tip="Quem comanda a luta (tecla Z)."><span>COMANDO</span><b>AUTO</b></button>
            <button id="advance-btn" class="ctl" type="button" data-tip="Avançar de estágio automaticamente ao vencer. Desligado = repetir o estágio para treinar."><span>AVANÇO</span><b>ON</b></button>
            <button id="speed-btn" class="ctl" type="button" data-tip="Velocidade da luta."><span>VEL</span><b>x1</b></button>
            <button id="retreat-btn" class="ctl danger" type="button" data-tip="Voltar para a cidade."><span>CIDADE</span><b>↩</b></button>
          </div>
        </div>

        <div class="stage-wallet" aria-label="Recursos principais">
          <span class="stage-res gold" data-tip="Ouro disponível"><i></i><b id="stage-gold-value">0</b></span>
          <span class="stage-res crystal" data-tip="Cristais disponíveis"><i></i><b id="stage-crystal-value">0</b></span>
        </div>

        <div class="village-actions" id="village-actions" hidden>
          <button class="signpost" style="left:25%;top:26%" data-open="city:guild" type="button" data-badge="guild" data-tip="Contratos e recompensas"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-shield"></i></span><span class="sp-plate"><b>Guilda</b><small class="sp-lv"></small></span></button>
          <button class="signpost" style="left:9%;top:32%" data-open="city:dojo" type="button" data-badge="dojo" data-tip="Treino da equipe"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-fist"></i></span><span class="sp-plate"><b>Dojo</b><small class="sp-lv"></small></span></button>
          <button class="signpost" style="left:51%;top:17%" data-open="collection" type="button" data-badge="collection" data-tip="Descobrir heróis"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-star"></i></span><span class="sp-plate"><b>Templo da Invocação</b><small class="sp-lv"></small></span></button>
          <button class="signpost" style="left:80%;top:68%" data-open="city:shrine" type="button" data-badge="shrine" data-tip="Despertar heróis"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-lantern"></i></span><span class="sp-plate"><b>Santuário</b><small class="sp-lv"></small></span></button>
          <button class="signpost hot" style="left:62%;top:40%" data-open="city:forge" type="button" data-badge="forge" data-tip="Aprimorar equipamentos"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-anvil"></i></span><span class="sp-plate"><b>Forja</b><small class="sp-lv"></small></span></button>
          <button class="signpost bank" style="left:12%;top:76%" data-open="bank" type="button" data-badge="bank" data-tip="Economia, cotações e carteira"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-gem"></i></span><span class="sp-plate"><b>Banco Kogane</b><small class="sp-lv"></small></span></button>
          <button class="signpost" style="left:15%;top:53%" data-open="shop:market" type="button" data-badge="market" data-tip="Ofertas e recursos"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-scale"></i></span><span class="sp-plate"><b>Mercado</b><small class="sp-lv"></small></span></button>
          <button class="signpost house" style="left:34%;top:33%" data-open="city:house" type="button" data-badge="house" data-tip="Galeria e Álbum de cartas"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-cards"></i></span><span class="sp-plate"><b>Casa do Time</b><small class="sp-lv"></small></span></button>
          <button class="signpost" style="left:47%;top:76%" data-open="city:workshop" type="button" data-badge="workshop" data-tip="Criar e encantar"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-orb"></i></span><span class="sp-plate"><b>Oficina</b><small class="sp-lv"></small></span></button>
          <button class="signpost featured" style="left:92%;top:68%" data-open="adventure:expeditions" type="button" data-badge="expeditions" data-tip="Enviar equipes agora"><em class="sp-badge" hidden></em><span class="sp-icon"><i class="ic ic-compass"></i></span><span class="sp-plate"><b>Casa de Expedições</b><small class="sp-lv"></small></span></button>
        </div>
        <aside class="village-hub" id="village-hub" hidden></aside>

        <ol class="turn-bar" id="turn-bar" hidden aria-label="Ordem das próximas ações"></ol>

        <div class="turn-cmd" id="turn-cmd" hidden>
          <span class="tc-who"><img id="tc-face" alt=""><span><small>SUA VEZ</small><b id="tc-name"></b></span></span>
          <button class="tc-btn primary" data-act="attack" type="button" data-tip="Golpe básico no alvo em foco. Gera energia."><i class="ic ic-swords"></i><b>Atacar</b><kbd>ESPAÇO</kbd></button>
          <button class="tc-btn" data-act="skill" type="button"><i class="ic ic-burst"></i><b>Habilidade</b><kbd></kbd></button>
          <button class="tc-btn" data-act="ult" type="button"><i class="ic ic-star"></i><b>Ultimate</b><kbd></kbd></button>
          <button class="tc-btn" data-act="defend" type="button" data-tip="Abre mão do golpe: metade do dano até a próxima vez dele e +15 de energia."><i class="ic ic-shield"></i><b>Defender</b><kbd>G</kbd></button>
        </div>
        <div class="consumables" id="consumables" hidden>
          <button class="cons guard" id="guard-btn" type="button" data-tip="<b>Guarda</b> · Espaço<br>Quando um inimigo dá o bote de um golpe preparado, um anel fecha sobre o alvo: erga a guarda com o anel na faixa dourada e é <b>APARO</b> (-80% de dano, sem atordoamento, +energia para todos e a postura do atacante abalada). Fora do tempo, ainda corta o dano pela metade.<br><small>Recarga de 6s.</small>"><i class="ic ic-shield"></i><b>GUARDA</b><i class="cd"></i><kbd>ESPAÇO</kbd></button>
          <button class="cons" id="potion-btn" type="button" data-tip="Poção de Cura: +35% HP na equipe (recarga 20s). Tecla 1."><img src="assets/icons/web/potion_red_01.webp" alt=""><b id="potion-count">0</b><i class="cd"></i><kbd>1</kbd></button>
          <button class="cons" id="elixir-btn" type="button" data-tip="Elixir de Energia: +50 energia na equipe (recarga 30s). Tecla 2."><img src="assets/icons/web/potion_blue_01.webp" alt=""><b id="elixir-count">0</b><i class="cd"></i><kbd>2</kbd></button>
        </div>

        <div class="stage-hint" id="stage-hint" hidden></div>
        <div class="warn-banner" id="warn-banner" hidden></div>
        <div id="loot-toast-area" class="loot-feed" aria-live="polite"></div>
        <div class="dialog-box" id="dialog-box" hidden></div>
        <div class="choice-modal" id="choice-modal" hidden></div>
        <div class="result-overlay" id="result-overlay" hidden></div>
      </section>

      <section class="lobby-bar" id="lobby-bar" hidden aria-label="Equipe e jornada"></section>
      <section class="dock" id="party-strip" aria-label="Equipe"></section>
    </main>

    <aside class="side-panel" id="side-panel">
      <section class="guide-card" id="guide-card"></section>
      <section class="event-card" id="event-card"></section>
      <div class="right-tabs" role="tablist">
        <button class="right-tab active" data-right="objectives" type="button">Contratos</button>
        <button class="right-tab" data-right="loot" type="button">Loot</button>
        <button class="right-tab" data-right="combat" type="button">Registro</button>
      </div>
      <div id="right-objectives" class="right-pane"></div>
      <div id="right-loot" class="right-pane" hidden></div>
      <div id="right-combat" class="right-pane log-pane" hidden></div>
    </aside>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><button class="modal-back-nav" id="modal-back-nav" type="button" hidden>← Mapa</button><div><span class="eyebrow" id="modal-kicker">MYTHVERSE</span><h2 id="modal-title">Painel</h2></div><div class="modal-tabs" id="modal-tabs"></div><button class="icon-btn close" data-close-modal type="button" aria-label="Fechar painel e voltar ao jogo">✕</button></header>
      <div class="modal-body" id="modal-body"></div>
      <button class="scroll-hint" id="scroll-hint" type="button" hidden aria-label="Rolar para ver mais"><span>Role para ver mais</span><i></i></button>
    </section>
  </div>

  <div class="summon-reveal" id="summon-reveal" hidden></div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

</body>
