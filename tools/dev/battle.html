<!doctype html>
<meta charset="utf-8">
<title>Batalha (desenvolvimento)</title>
<base href="../../">
<body style="margin:0;background:#111;overflow:hidden">
<div id="wrap" style="width:1280px;height:720px;overflow:hidden;position:relative"><canvas id="c" style="display:block"></canvas></div>
<canvas id="strip" style="display:none"></canvas>
<pre id="log" style="position:fixed;left:6px;bottom:4px;margin:0;font:12px monospace;color:#9f9;text-shadow:0 1px 2px #000;pointer-events:none"></pre>
<script src="src/config.js"></script>
<script src="src/data.js"></script>
<script src="src/utils.js"></script>
<script src="src/icons.js"></script>
<script src="src/items.js"></script>
<script src="src/progression.js"></script>
<script src="src/roster.js"></script>
<script src="src/builds.js"></script>
<script src="src/engine.js"></script>
<script src="src/assets.js"></script>
<script src="src/sprite-meta.js"></script>
<script src="src/renderer.js"></script>
<script>
// Ferramenta de desenvolvimento: uma luta sem login, com semente fixa, para conferir animações e efeitos em alta resolução.
//   ?zone=hunt&stage=3 | ?zone=dungeon&floor=1 | ?zone=boss&tier=0      onde lutar (padrão hunt, estágio 3)
//   ?heroes=a,b,c,d&lvl=20      equipe e nível (padrão erik,akira,aurelia,warden nível 14)
//   ?t=6                        segundos simulados antes da foto (padrão 6)
//   ?cmd=mode:manual@0;skill:0@2.5;guard@3;ult:1@4      comandos do jogador, cada um no seu segundo
//   ?parry=1                    ergue a guarda sozinho no instante certo de cada ataque preparado (para ver o Aparo)
//   ?zoom=2&x=300&y=300         amplia a partir do ponto (x, y) da cena 1280×720
//   ?strip=1&n=12&dt=.05&crop=x,y,w,h    tira n quadros seguidos a partir de t (recorte opcional) e mostra em grade
//   ?seed=7                     semente dos sorteios
//   ?turbo=1                    tempo corrido (sem a pausa de cada ação) · ?order=attack|skill|defend  ordem dada na vez do herói
//   ?hold=1                     não responde à vez do herói (para ver a luta esperando a ordem)
(async () => {
  const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
  const ids = (q.get('heroes') || 'erik,akira,aurelia,warden').split(',');
  const zoom = num('zoom', 1), ox = num('x', 0), oy = num('y', 0);
  // Sorteios com semente: a mesma URL dá sempre a mesma luta.
  let sd = num('seed', 7) >>> 0; Math.random = () => { sd = (sd + 0x6D2B79F5) >>> 0; let t = sd; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const canvas = document.getElementById('c');
  canvas.style.width = 1280 * zoom + 'px'; canvas.style.marginLeft = -ox * zoom + 'px'; canvas.style.marginTop = -oy * zoom + 'px';
  const D = KT.Data, assets = new KT.AssetBank();
  const state = KT.State.createState();
  state.collection = ids.map(id => Object.assign(KT.State.newHeroRecord(D.roster.find(t => t.id === id), 'epic'), { level:num('lvl', 14) }));
  state.formation = state.collection.slice(0, 4).map(h => h.uid);
  state.story.seen.intro = state.story.seen.intro2 = state.story.seen.team = true; state.starterRolls = 0;
  state.consumables.potion = 5; state.consumables.elixir = 5; state.player.level = 60;
  Object.keys(D.zones).forEach(z => { Object.assign(state.progress[z] ||= {}, { best:12, kills:3 }); });
  state.settings.autoAdvance = false;
  const engine = new KT.CombatEngine(state, {});
  engine.cinematic = !q.has('turbo');   // ritmo de RPG (uma ação por vez); ?turbo=1 volta ao tempo corrido
  const R = new KT.GameRenderer(canvas, assets, engine); R.resize();
  if (q.get('fx') === 'intense') Object.defineProperty(R, 'intense', { get:() => true });
  const logs = [];
  engine.events = { onFx:fx => R.emit(fx), onLoot:item => R.emit({ type:'loot', item }), onWarn:t => logs.push(`${engine.zoneElapsed.toFixed(2)} aviso: ${t}`), onLog:p => { if (p?.type === 'skill' || p?.type === 'boss') logs.push(`${engine.zoneElapsed.toFixed(2)} ${p.text}`); } };
  // Carrega tudo com promessas (o Chrome sem janela acelera os temporizadores, mas não a rede).
  const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('falhou: ' + src)); i.src = src; });
  await assets.loadAll();
  const zone = q.get('zone') || 'hunt';
  const sceneUrl = KT.sceneUrl(D.zones[zone].scene || zone);
  assets.images.set(sceneUrl, await load(sceneUrl));
  const json = async f => (await fetch(`assets/anim/${f}.json`)).json();
  const index = await json('index'), variants = await json('variants'), families = await json('families').catch(() => ({}));
  assets._animIdx = new Set(index); assets._animVar = variants; assets._animFam = families; assets.anims = new Map();
  const sheet = async id => { if (assets.anims.has(id) || !assets._animIdx.has(id)) return; const [meta, img] = await Promise.all([fetch(`assets/anim/${id}.json`).then(r => r.json()), load(`assets/anim/${id}.webp`)]); assets.anims.set(id, { meta, img, ready:true }); };
  await Promise.all([...ids.map(id => D.roster.find(t => t.id === id).sprite), 'fox', 'oni', 'golem', 'spider', 'wisp', 'revenant', 'eclipse', 'dragon', 'lantern_kitsune', 'dragon_amber', 'raijin'].map(sheet));
  // Variações de cor: só processamento (sem rede), então dá para esperar girando o relógio.
  const ensure = async () => { for (let k = 0; k < 400; k++) { const pend = [...engine.party, ...engine.enemies].filter(u => (assets._animIdx.has(u.sprite) || assets._animVar[u.sprite]) && !assets.anim(u.sprite) && !assets.anims.get(u.sprite)?.failed); if (!pend.length) return; await new Promise(r => setTimeout(r, 0)); } };
  engine.enterZone(zone, { stage:num('stage', 3), floor:num('floor', 1), tier:num('tier', 0) });
  const cmds = (q.get('cmd') || '').split(';').filter(Boolean).map(c => { const [what, at] = c.split('@'), [kind, arg] = what.split(':'); return { kind, arg:arg === undefined ? undefined : isNaN(arg) ? arg : Number(arg), at:Number(at) || 0, done:false }; });
  let T = 0; const DTF = 1 / 60;
  const step = async dt => {
    await ensure();
    cmds.forEach(c => { if (!c.done && T >= c.at) { c.done = true; const ok = engine.input(c.kind, c.arg); logs.push(`${T.toFixed(2)} comando ${c.kind}${c.arg !== undefined ? ':' + c.arg : ''} → ${ok}`); } });
    if (q.has('parry') && R.qte && R.qte.result === null && R.qte.t / R.qte.dur > .7 && !(engine.guardCd > 0)) logs.push(`${T.toFixed(2)} guarda no anel → ${engine.input('guard', R.qteQuality())}`);
    if (engine.awaiting !== null && !q.has('hold')) { const w = q.get('order') || 'attack'; const ok = w === 'skill' ? engine.input('skill', engine.awaiting) || engine.input('act', 'attack') : engine.input('act', w); logs.push(`${T.toFixed(2)} ordem ${w} → ${ok}`); }
    if (!(R.freeze > 0)) engine.update(dt);
    R.update(dt); T += dt;
  };
  for (const t1 = num('t', 6); T < t1;) await step(DTF);
  R.render();
  if (q.has('strip')) {
    const n = num('n', 12), dt = num('dt', .05), crop = (q.get('crop') || '0,0,1280,720').split(',').map(Number), per = Math.min(n, num('per', 4));
    const S = document.getElementById('strip'), g = S.getContext('2d'), k = R.scale, CW = num('cw', Math.round(crop[2] * num('k', .5))), CH = Math.round(CW * crop[3] / crop[2]);
    S.width = CW * per; S.height = CH * Math.ceil(n / per); S.style.display = 'block'; document.getElementById('wrap').style.display = 'none'; document.body.style.background = '#223';
    for (let i = 0; i < n; i++) {
      for (let a = 0; a < dt - 1e-9; a += DTF) await step(DTF);
      R.render();
      g.drawImage(canvas, crop[0] * k, crop[1] * k, crop[2] * k, crop[3] * k, (i % per) * CW, Math.floor(i / per) * CH, CW, CH);
      g.fillStyle = '#ff0'; g.font = '12px monospace'; g.fillText(`t=${T.toFixed(2)} ${engine.phase}${engine.guardT > 0 ? ' GUARDA' : ''}`, (i % per) * CW + 4, Math.floor(i / per) * CH + 14);
    }
  }
  if (q.has('log')) document.getElementById('log').textContent = logs.slice(-num('log', 12)).join('\n') + `\nfase ${engine.phase} · onda ${engine.wave} · aparos ${state.stats.parries || 0} · guardas ${state.stats.guards || 0} · hab. manuais ${state.stats.manualSkills || 0}`;
  document.title = 'ready';
})().catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="font:14px monospace;color:#fff">' + e.stack + '</pre>'); document.title = 'ready'; });
</script>
